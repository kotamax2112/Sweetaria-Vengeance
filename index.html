<!-- WARDROBE -->
<div id="wardrobe-popup" class="popup hidden">
  <div class="panel wide">
    <h3>WARDROBE</h3>

    <div id="player-preview"></div>

    <div class="wardrobe-tabs">
      <button class="wardrobe-tab active" data-tab="content-gear">Gear</button>
      <button class="wardrobe-tab" data-tab="content-skins">Skins</button>
    </div>

    <!-- GEAR TAB -->
    <div id="content-gear" class="wardrobe-content active scroll-col">

      <div class="field">
        <label>Name</label>
        <input id="player-name-input" type="text" maxlength="12">
      </div>

      <div class="field">
        <label>Gender</label>
        <div class="gender-options item-row">
          <button class="btn gender-btn" data-gender="m">Male</button>
          <button class="btn gender-btn" data-gender="f">Female</button>
          <button class="btn gender-btn" data-gender="o">Other</button>
        </div>
      </div>

      <div class="field">
        <label>Hair Style</label>
        <div id="hair-options" class="item-row"></div>
      </div>

      <div class="field">
        <label>Skin Tone</label>
        <div id="skin-options" class="color-options"></div>
      </div>

      <div class="field">
        <label>Shirt Color</label>
        <div id="shirt-options" class="color-options"></div>
      </div>

      <div class="field">
        <label>Pants Color</label>
        <div id="pants-options" class="color-options"></div>
      </div>

      <div class="field">
        <label>Held Item</label>
        <div id="item-options" class="item-row"></div>
      </div>

    </div>

    <!-- SKINS TAB -->
    <div id="content-skins" class="wardrobe-content scroll-col">
      <p class="skins-note">Unlock skins by completing Awards.</p>
      <div id="skins-grid" class="skins-grid"></div>
      <button id="clear-skin-btn" class="btn small" style="margin-top:15px;">Unequip Skin</button>
    </div>

    <button class="btn secondary close-btn" style="margin-top:15px;">Save & Close</button>
  </div>
</div>

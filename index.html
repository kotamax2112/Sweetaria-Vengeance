<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sweetaria: Vengeance</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="game.js"></script>
</head>
<body>

<div id="title-screen" class="screen">
  <div id="title-bg"><div class="flame"></div></div>
  <div class="title-content">
    <h1 class="game-title">SWEETARIA<br><span style="font-size:0.6em; color:#b8c6e3">VENGEANCE</span></h1>
    <p class="tap-to-start">TAP TO START</p>
  </div>
</div>

<div id="home-screen" class="screen hidden">
  <button id="settings-btn" class="icon-btn">⚙️</button>
  <h2 style="margin-bottom:20px;">MAIN MENU</h2>
  <div class="menu-buttons">
    <button id="play-btn" class="btn primary">STORY MODE</button>
    <button id="endless-btn" class="btn">ENDLESS RUN</button>
    <button id="wardrobe-btn" class="btn">WARDROBE</button>
    <div class="row">
      <button id="lore-btn" class="btn small">LORE</button>
      <button id="achievements-btn" class="btn small">AWARDS</button>
    </div>
    <button id="share-btn" class="btn secondary">SHARE</button>
  </div>
</div>

<div id="game-screen" class="screen hidden">
  <div id="top-ui">
    <span><b id="player-name-display">Hero</b></span>
    <span id="level-display">Lv 1</span>
    <span>Score: <b id="score-display">0</b></span>
    <span id="shield-indicator" class="hidden">🛡️</span>
  </div>
  <div id="level-progress-wrap"><div id="level-progress-fill"></div></div>
  <button id="pause-btn" class="icon-btn">II</button>
  <canvas id="game-canvas" width="800" height="480"></canvas>
  <button id="jump-btn" class="jump-btn">JUMP</button>
</div>

<div id="pause-menu" class="popup hidden">
  <div class="panel">
    <h3>PAUSED</h3>
    <div class="row" style="margin:15px 0;">
      <button id="pause-music-btn" class="btn small">Music: ON</button>
      <button id="pause-sfx-btn" class="btn small">SFX: ON</button>
    </div>
    <button id="resume-btn" class="btn primary">RESUME</button>
    <div style="margin-top:10px;"></div>
    <button id="quit-btn" class="btn danger">QUIT</button>
  </div>
</div>

<div id="dev-menu" class="popup hidden">
  <div class="panel">
    <h3>DEVELOPER CONSOLE</h3>
    <p style="font-size:0.7rem; color:#888;">Level Select</p>
    <div class="dev-grid">
      <button class="dev-btn" onclick="window.devJump(1)">1</button>
      <button class="dev-btn" onclick="window.devJump(2)">2</button>
      <button class="dev-btn" onclick="window.devJump(3)">3</button>
      <button class="dev-btn" onclick="window.devJump(4)">4</button>
      <button class="dev-btn" onclick="window.devJump(5)">BOSS 1</button>
      <button class="dev-btn" onclick="window.devJump(6)">6</button>
      <button class="dev-btn" onclick="window.devJump(7)">7</button>
      <button class="dev-btn" onclick="window.devJump(8)">8</button>
      <button class="dev-btn" onclick="window.devJump(9)">9</button>
      <button class="dev-btn" onclick="window.devJump(10)">FINAL</button>
    </div>
    <p style="font-size:0.7rem; color:#888;">Cheats</p>
    <div class="row">
      <button class="btn small" onclick="window.devPower('shield')">+ Shield</button>
      <button class="btn small" onclick="window.devPower('laser')">+ Laser</button>
      <button class="btn small" onclick="window.devPower('jetpack')">+ Jetpack</button>
    </div>
    <button class="btn secondary close-btn" style="margin-top:15px;">CLOSE</button>
  </div>
</div>

<div id="start-popup" class="popup hidden">
  <div class="panel">
    <h3>CONTINUE?</h3>
    <div class="row" style="margin-top:15px;">
      <button id="start-at-last" class="btn primary">CHECKPOINT</button>
      <button id="start-beginning" class="btn">NEW RUN</button>
    </div>
  </div>
</div>

<div id="settings-popup" class="popup hidden">
  <div class="panel">
    <h3>SETTINGS</h3>
    <div class="row" style="margin:15px 0;">
      <button id="music-toggle" class="btn">Music: ON</button>
      <button id="sfx-toggle" class="btn">SFX: ON</button>
    </div>
    <button id="reset-progress-btn" class="btn danger">RESET DATA</button>
    <button id="open-credits-btn" class="btn">CREDITS</button>
    <button class="btn secondary close-btn" style="margin-top:10px;">CLOSE</button>
  </div>
</div>

<div id="wardrobe-popup" class="popup hidden"><div class="panel"><h3>Wardrobe</h3><div id="player-preview"></div><button id="close-wardrobe" class="btn close-btn">Close</button></div></div>
<div id="lore-popup" class="popup hidden"><div class="panel"><h3>Lore</h3><canvas id="lore-boss1"></canvas><button class="btn close-btn">Close</button></div></div>
<div id="achievements-popup" class="popup hidden"><div class="panel"><h3>Awards</h3><div id="achievements-grid"></div><button class="btn close-btn">Close</button></div></div>
<div id="share-popup" class="popup hidden"><div class="panel"><h3>Share</h3><input id="share-link"><button class="btn close-btn">Close</button></div></div>
<div id="credits-popup" class="popup hidden"><div class="panel"><h3>Credits</h3><p>Created by Dakota</p><button class="btn close-btn">Close</button></div></div>
<div id="death-popup" class="popup hidden"><div class="panel"><h3>YOU DIED</h3><button id="death-restart-checkpoint" class="btn primary">Retry</button><button id="death-exit-main" class="btn">Quit</button></div></div>
<div id="rpg-overlay" class="screen hidden"><div class="rpg-wrap"><div class="boss-head">😈</div><div class="boss-hp"><div id="boss-hp-bar"></div></div><div class="rpg-actions"><button class="btn insult-btn"></button><button class="btn insult-btn"></button><button class="btn insult-btn"></button><button class="btn insult-btn"></button></div><div id="rpg-log" class="rpg-log"></div></div></div>

</body>
</html>
